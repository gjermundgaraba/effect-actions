name: npm
# Release: bump the version, commit, tag v<version> and push the tag. Publishes every package whose
# version npm doesn't have yet, through npm trusted publishing. A new package's first version is
# published by hand (`vp pm publish`), then `npm trust github <package> --repo <repo> --file npm.yml`.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Check that the tag names the version of every package it publishes
        run: |
          versions=$(vp exec pnpm ls -r --depth -1 --json | jq -r '[.[] | select(.private | not) | .version] | unique | join(" ")')
          test "$versions" = "${GITHUB_REF_NAME#v}"
      - run: vp run build
      - run: vp pm publish -r --no-git-checks
