name: npm
# Release: bump the version, commit, tag v<version> and push the tag. Publishes every package whose
# version npm doesn't have yet, through npm trusted publishing. A new package's first version is
# published by hand (`vp pm publish`), then `npm trust github <package> --repo <repo> --file npm.yml`.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run build
      - run: vp pm publish -r --no-git-checks
