name: Latest Effect 4

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          cache-toolchain: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp update -r effect@^4 @effect/platform-node@^4 @effect/vitest@^4
      - name: Show the Effect releases under test
        run: >-
          node -e 'for (const p of ["effect", "@effect/platform-node", "@effect/vitest"]) console.log(p, JSON.parse(require("fs").readFileSync(`node_modules/${p}/package.json`, "utf8")).version)'
      - run: vp check
      - run: vp test
      - run: vp run test:package
