name: Latest Effect 4

# The `effect` peer admits only 4.0.x patches, since the modules the surfaces build on are
# unstable in Effect and a minor release may change them. This runs the full check against the
# newest 4.x, so a minor that passes can be admitted (AGENTS.md#release).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          cache-toolchain: true
          run-install: false
      - run: vp install --frozen-lockfile
      # Every Effect package on the same newest 4.x release, as setup-failures.md requires.
      - run: vp add -D effect@^4 @effect/platform-node@^4 @effect/vitest@^4
      - name: Show the Effect releases under test
        run: >-
          node -e 'for (const p of ["effect", "@effect/platform-node", "@effect/vitest"])
          console.log(p, JSON.parse(require("fs").readFileSync(`node_modules/${p}/package.json`, "utf8")).version)'
      - run: vp check
      - run: vp test
      - run: vp run test:package
