catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitest: 5.0.3
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@effect/platform-node-shared@4.0.4"
  - "@effect/platform-node@4.0.4"
  - "@effect/vitest@4.0.4"
  - effect@4.0.4
