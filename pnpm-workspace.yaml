packages:
  - packages/*
catalog:
  "@clanker-stuff/oxlint-config": 0.5.1
  "@cloudflare/vitest-plugin": 1.6.1
  "@cloudflare/workers-types": 5.20261121.1
  "@effect/platform-cloudflare": 4.1.6
  "@effect/platform-node": 4.1.6
  "@effect/sql-sqlite-node": 4.1.6
  "@effect/tsgo": 0.73.2
  "@effect/vitest": 4.1.6
  effect: 4.1.6
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vitest: 5.1.0
  ultracite: 8.3.1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  esbuild: true
  workerd: true
catalogMode: prefer
saveExact: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@clanker-stuff/*"
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - tsrs
  - "@tsrs/*"
  - vitest
  - "@vitest/*"
  - "@gjermundgaraba/*"
  - "@gjermundgaraba-designs/*"
  - effect
  - "@effect/*"
# Name the directories pnpm links Ultracite's skill into: without one it auto-detects an agent,
# and where none is installed, as in a Docker build, the install fails.
skills:
  dirs:
    - .agents/skills
    - .claude/skills
permissions:
  ultracite:
    skills: true
