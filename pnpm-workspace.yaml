catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitest: 5.0.3
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  esbuild: true

# Effect 4.0.2 is newer than pnpm's default one-day release age; drop these once it is not.
minimumReleaseAgeExclude:
  - effect@4.0.2
  - "@effect/platform-node@4.0.2"
  - "@effect/platform-node-shared@4.0.2"
  - "@effect/vitest@4.0.2"
