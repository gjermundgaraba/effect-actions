catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

allowBuilds:
  esbuild: true

# Effect 4.0.0 is newer than pnpm's default one-day release age; drop these once it is not.
minimumReleaseAgeExclude:
  - effect@4.0.0
  - "@effect/platform-node@4.0.0"
  - "@effect/platform-node-shared@4.0.0"
