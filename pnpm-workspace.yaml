packages:
  - packages/*
catalog:
  "@clanker-stuff/oxlint-config": 0.1.0
  "@cloudflare/vitest-plugin": 1.4.7
  "@cloudflare/workers-types": 5.20261025.1
  "@effect/platform-node": 4.0.6
  "@effect/tsgo": 0.57.0
  "@effect/vitest": 4.0.6
  effect: 4.0.6
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  ultracite: 8.0.2
  oxfmt: 0.74.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  esbuild: true
  workerd: true
catalogMode: prefer
saveExact: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@clanker-stuff/*"
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - "@gjermundgaraba/*"
  - "@gjermundgaraba-designs/*"
  - effect
  - "@effect/*"
# Name the directories pnpm links Ultracite's skill into: without one it auto-detects an agent,
# and where none is installed, as in a Docker build, the install fails.
skills:
  dirs:
    - .agents/skills
    - .claude/skills
permissions:
  ultracite:
    skills: true
